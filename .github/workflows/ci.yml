name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI machines are smaller than dev laptops; keep the daemon within the runner's memory.
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  wrapper:
    name: Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
      - name: JVM + Robolectric tests
        run: ./gradlew test --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  screenshots:
    name: Screenshots
    # Goldens are recorded on Apple-silicon Macs. Robolectric's native graphics anti-alias thin strokes
    # (the dial's hatched arcs) slightly differently on Linux, so verify on the same platform rather than
    # loosening the comparison, which would also hide one-glyph regressions like a flipped "+"/"−".
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
      - name: Verify Roborazzi goldens
        run: ./gradlew verifyRoborazziDebug --continue
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/'
          retention-days: 7

  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android-build
      - name: Build debug, release and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clockblock-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  babysit-skill:
    name: babysit-pr watcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .agents/skills/babysit-pr/scripts -p 'test_*.py' -v
