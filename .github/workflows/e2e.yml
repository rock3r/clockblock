name: e2e

# Separate from CI so a flaky emulator run can be retried on its own: the babysit-pr watcher reruns failed
# workflows whose *name* contains "e2e" (retry_eligible_workflow_keywords), without a diagnosis first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI machines are smaller than dev laptops; keep the daemon within the runner's memory.
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

jobs:
  e2e:
    name: e2e (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/setup-android-build
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      # Stop-gap (#122): CI's API 37 emulator keeps restarting system_server (see below), so the suite can't run to
      # the end. Until it can, a failed or empty run is a warning on the job, not a failure, so the job isn't green
      # without saying so and doesn't block every pull request. Remove the stop-gap with #122: both continue-on-error lines and the warning step.
      - name: Connected tests
        id: connected
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # minSdk is 37. The SDK names API 37 packages with a minor version (platforms;android-37.0,
          # system-images;android-37.0;google_apis;x86_64), so the level is the string "37.0".
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # The default /data partition is too small for the debug and test APKs: installs failed with "Requested
          # internal only, but not enough space". The AVD is created fresh on every run (no AVD cache), so this
          # always applies.
          disk-size: 8G
          ram-size: 4096 # MB, a bare number (hw.ramSize)
          disable-animations: true
          # The API 37 image's gralloc mapper aborts any CPU read of a host colour buffer unless the host offers
          # ReadColorBufferDma, which no emulator with host-side software rendering does yet (stable 37.2.12, canary
          # 37.3.3; -gpu guest and swangle_indirect too): surfaceflinger's region sampling and system_server's task
          # snapshots read buffers back, so system_server keeps restarting (#122). The canary emulator gets furthest.
          channel: canary
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The script waits for a steady system, retries a failed install once and keeps the Gradle log for the check
          # below.
          script: bash .github/scripts/run-e2e.sh
      # The runner can end successfully without running anything (an APK that didn't install); make that a failure.
      - name: Check that the e2e tests ran
        id: verify
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bash .github/scripts/verify-e2e-ran.sh connected-tests.log
      - name: Warn that the e2e tests didn't pass
        if: ${{ !cancelled() && (steps.connected.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        run: |
          echo "::warning title=e2e didn't pass::The e2e suite failed or didn't run (connected: ${{ steps.connected.outcome }}, check: ${{ steps.verify.outcome }}). It is non-blocking until #122 is fixed; see the e2e-reports artifact."
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            connected-tests.log
            emulator-logcat-*.txt
          retention-days: 7
